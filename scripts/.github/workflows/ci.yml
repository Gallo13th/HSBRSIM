name: ci

# 目的：证明「干净 checkout + 一条命令」就能装上环境并跑通门禁。
# 只用 CPU runner（训练需要 GPU，CI 不跑训练）。
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust toolchain (from rust/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Bootstrap (deps + engine + smoke)
        # CI 里不需要 torch（不跑训练）；bootstrap 的 SKIP_PIP 会跳过 torch 安装
        env:
          SKIP_PIP: "1"
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          bash scripts/bootstrap.sh
          # bootstrap 在 SKIP_PIP=1 时不跑门禁，这里显式跑
          PYTHONPATH=rust/python:. python scripts/verify_all.py --fast

      - name: pytest
        run: PYTHONPATH=rust/python:. python -m pytest tests -q
