[package]
name = "hsbg-engine-py"
description = "Python bindings for hsbg-engine (HSBRSIM fork of TavernGym; MIT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
hsbg-engine = { path = "../hsbg-engine" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0.151"
