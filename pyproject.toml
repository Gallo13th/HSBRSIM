[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsbg-agent"
version = "0.3.0"
description = "Hearthstone Battlegrounds RL project: Rust main engine (hsbg_engine, forked from AutoTavern TavernGym) + legacy Python engine (hsrl2) + RL environment/policy/training; action/observation aligned with AutoTavern"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

# AutoTavern 借鉴升级（2026-10-26 第一阶段）：TavernBench 评测
# （benchmarks/tavernbench，vendored，评分纯标准库）与 TavernGym 参照后端
# （hsbg/backends；需从 AutoTavern 源码构建，PyPI 无发布包，故不列为 pip 依赖）。
# 第二阶段（P2）：Rust 主引擎 hsbg_engine 位于 rust/，用 maturin 单独构建安装
# （cd rust && python -m pip install -e .），不作为本包硬依赖；不安装时 legacy
# hsrl2 流程/测试不受影响（tests/test_rust_engine.py 自动 skip）。
# 见 docs/AUTOTAVERN_UPGRADE.md / docs/AUTOTAVERN_P2_KICKOFF.md / docs/RUST_ENGINE.md。
[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hsrl2*", "hsbg*"]

[tool.pytest.ini_options]
testpaths = ["tests", "hsrl2/tests"]
addopts = "-q"
