[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsbg-agent"
version = "0.1.0"
description = "Hearthstone Battlegrounds simulation engine + RL environment + policy agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hsrl2*", "hsbg*"]

[tool.pytest.ini_options]
testpaths = ["tests", "hsrl2/tests"]
addopts = "-q"
